# Financial & Monthly-Cost Knobs
# Override any of these on the fly via CLI flags (`house rank --max-monthly 7500 --rate 6.25 --down 25`)

# Gross annual household income (used for NYC DTI % calculation & co-op board checks)
annual_income: 300000

# Hard ceiling on asking price
max_price: 2000000
min_price: 0

# PRIMARY KNOB: Maximum all-in monthly housing cost (Mortgage P&I + Maintenance/HOA + Taxes + Insurance)
# At $300k/yr ($25k/mo gross), $7,000/mo = 28% front-end DTI (classic NYC co-op board ceiling).
max_monthly_cost: 7000

# NYC DTI guardrails (% of gross monthly income)
coop_max_dti_pct: 28.0
condo_max_dti_pct: 36.0

# Mortgage assumptions
down_payment_pct: 20.0
max_cash_down: null
interest_rate_pct: 6.50
loan_term_years: 30

# Monthly carrying cost defaults
monthly_insurance_default: 150.0
townhouse_insurance_monthly: 275.0
fallback_condo_tax_rate_pct: 0.90
fallback_coop_maint_per_sqft: 2.25

# Carrying-cost guardrails
max_monthly_fees_ratio: 0.40
coop_min_down_pct: 20.0

# Optional effective after-tax estimate
use_after_tax_for_filter: false
marginal_tax_rate_pct: 42.0
coop_tax_deductible_pct: 0.45

# Multi-unit townhouse ("house hacking") rental offset assumptions
est_rent_per_unit: 3200.0         # Estimated gross monthly rent per extra unit (units 2, 3, ...)
rental_net_factor: 0.85           # Keep 85% of gross rent after vacancy/repairs (lenders credit ~75%)
use_net_rental_for_filter: true   # Filter 2-3 unit townhouses using net out-of-pocket monthly cost

# NYT-style Buy vs. Rent comparison assumptions
current_monthly_rent: 5300.0      # Your current rent ($5.3k/mo 2b2b luxury apartment)
hold_years: 7                     # Expected holding period in years
home_appreciation_pct: 3.0        # Annual NYC home price growth (%)
rent_growth_pct: 3.5              # Annual NYC rent & carrying-cost inflation (%)
investment_return_pct: 7.0        # Expected annual return if down payment & savings stay invested (%)
selling_cost_pct: 6.5             # NYC seller closing costs (broker + transfer/flip taxes)

