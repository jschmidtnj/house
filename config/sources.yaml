# Listing Sources Configuration
# Enable one or more free / nearly-free adapters. All sources normalize into the same SQLite schema
# and deduplicate by normalized (address, unit).

sources:
  # HomeHarvest (Realtor.com / MLS feed) — 100% free, unlimited, no API key required
  # Install with: pip install -e ".[live]"
  homeharvest:
    enabled: true
    locations:
      # Manhattan: LES/Chinatown, EV, FiDi, Gramercy, Chelsea, SoHo/Nolita, Tribeca, West Village, Kips Bay/Murray Hill, Midtown East
      - "10002"
      - "10003"
      - "10005"
      - "10009"
      - "10010"
      - "10011"
      - "10012"
      - "10013"
      - "10014"
      - "10016"
      - "10017"
      - "10022"
      - "10038"
      # Brooklyn: DUMBO/BK Heights/Downtown BK, Fort Greene/Navy Yard/Clinton Hill, Bushwick, Williamsburg, Bed-Stuy, Boerum Hill, Greenpoint, Carroll Gardens/Red Hook
      - "11201"
      - "11205"
      - "11206"
      - "11211"
      - "11216"
      - "11217"
      - "11221"
      - "11222"
      - "11231"
      - "11237"
      - "11238"
      - "11249"
      # Queens: Long Island City & Astoria
      - "11101"
      - "11102"
      - "11103"
      - "11106"
      # NJ (PATH-accessible): Hoboken, Downtown Jersey City, Newport, Journal Square
      - "07030"
      - "07302"
      - "07306"
      - "07310"
    past_days: 45
    limit: 60
    extra_property_data: true
    include_multifamily_pass: false

  # Local JSON/CSV exports dropped into data/imports/ (100% free, zero anti-bot issues)
  local_import:
    enabled: true
    import_dir: data/imports

  # Saved-search email alerts via IMAP (StreetEasy, Redfin, Zillow, Compass) — 100% free
  email_alerts:
    enabled: false
    sender_filters:
      - streeteasy.com
      - redfin.com
      - zillow.com
      - compass.com
    max_emails_per_poll: 50

  # RapidAPI StreetEasy wrapper ("NYC Real Estate API") — free tier available (~50-100 req/mo)
  rapidapi_streeteasy:
    enabled: false
    areas:
      - upper-west-side
      - chelsea
      - park-slope
      - brooklyn-heights
      - williamsburg
    limit_per_area: 25

  # RentCast official REST API — free tier (50 req/mo)
  rentcast:
    enabled: false
    city: New York
    state: NY
    zip_codes: []
    limit: 50
