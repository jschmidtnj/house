[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "house"
version = "0.1.0"
description = "NYC apartment hunting bot with pluggable listing sources, monthly-cost optimizer, SQLAlchemy persistence, and Discord alerts"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
live = [
    "homeharvest>=0.6",
]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
house = "house.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
