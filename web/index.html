<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>House — NYC Apartment & Monthly Cost Optimizer</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("house-theme");
          var light = saved ? saved === "light" : window.matchMedia("(prefers-color-scheme: light)").matches;
          document.documentElement.classList.add(light ? "light" : "dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body class="bg-zinc-950 text-zinc-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
